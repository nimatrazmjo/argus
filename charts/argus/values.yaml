# Optional private registry (e.g. ACR). Empty = pull upstream images.
# Set => <registry>/argus/<name:tag>; import first (see deploy/images.txt).
imageRegistry: ""

clickhouse:
  password: argus123
  keeperImage: clickhouse/clickhouse-keeper:latest
  serverImage: clickhouse/clickhouse-server:25.12.5

signoz:
  image: signoz/signoz:v0.145.0
  otelCollectorImage: signoz/signoz-otel-collector:v0.144.13
  # schema migrator retries while ClickHouse/keeper come up (slow clusters need many)
  migratorBackoffLimit: 30

secrets:
  pagingWebhookToken: argus-paging-webhook-token-32b
  rumIngestToken: argus-rum-ingest-token-default-32b
  jwtSecret: argus-agency-piv-cac-shared-secret-key-32b

storage:
  s3Image: chrislusf/seaweedfs:latest
  pyroscopeImage: grafana/pyroscope:1.7.1

infra:
  kubeStateMetricsImage: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
  nodeExporterImage: quay.io/prometheus/node-exporter:v1.8.2

otel:
  collectorImage: otel/opentelemetry-collector-contrib:0.160.0
  autoinstrumentPythonImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:0.65b0
  autoinstrumentNodejsImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:0.78.0
  autoinstrumentJavaImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2

beyla:
  image: grafana/beyla:2.2.4

ingress:
  enabled: true
  className: traefik
  host: argus.local

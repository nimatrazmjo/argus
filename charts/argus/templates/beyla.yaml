apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-beyla
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-beyla
    {{- include "argus.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-beyla
  labels:
    app.kubernetes.io/name: argus-beyla
    {{- include "argus.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-beyla
  labels:
    app.kubernetes.io/name: argus-beyla
    {{- include "argus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-beyla
subjects:
  - kind: ServiceAccount
    name: argus-beyla
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-beyla-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-beyla
    {{- include "argus.labels" . | nindent 4 }}
data:
  beyla-config.yml: |
    log_level: INFO
    attributes:
      kubernetes:
        enable: true
    discovery:
      instrument:
        - open_ports: "80,443,8000-9999"
      exclude_instrument:
        - kubernetes:
            namespace: "kube-system"
        - kubernetes:
            namespace: "kube-public"
        - kubernetes:
            namespace: "kube-node-lease"
    otel_traces_export:
      endpoint: "http://argus-gateway-collector.{{ .Release.Namespace }}.svc.cluster.local:4318"
      protocol: "http/protobuf"
      batch_timeout: 1s
      max_queue_size: 2048
    otel_metrics_export:
      endpoint: "http://argus-gateway-collector.{{ .Release.Namespace }}.svc.cluster.local:4318"
      protocol: "http/protobuf"
      interval: 10s
    network:
      enable: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-beyla
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-beyla
    {{- include "argus.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-beyla
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      serviceAccountName: argus-beyla
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
        - name: beyla
          image: {{ .Values.imageRegistry }}/argus/{{ .Values.beyla.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: BEYLA_CONFIG_PATH
              value: "/etc/beyla/beyla-config.yml"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.{{ .Release.Namespace }}.svc.cluster.local:4318"
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            - name: BEYLA_OPEN_PORT
              value: "80,443,8000-9999"
          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: false
            capabilities:
              add: [BPF, PERFMON, NET_ADMIN, NET_RAW, SYS_PTRACE, SYS_RESOURCE, DAC_READ_SEARCH, SYS_ADMIN]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: config
              mountPath: /etc/beyla
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: argus-beyla-config
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

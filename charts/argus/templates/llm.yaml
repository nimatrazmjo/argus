apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-aiops-llm-code
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-aiops-llm
    {{- include "argus.labels" . | nindent 4 }}
data:
  aiops_llm_service.py: |
    {{ .Files.Get "files/aiops_llm_service.py" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-aiops-llm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-aiops-llm
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-llm
      port: 9098
      targetPort: 9098
      protocol: TCP
  selector:
    app.kubernetes.io/name: argus-aiops-llm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-aiops-llm
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-aiops-llm
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-aiops-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-aiops-llm
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: aiops-llm
          image: {{ .Values.imageRegistry }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/aiops_llm_service.py"]
          env:
            - name: PORT
              value: "9098"
            - name: CLICKHOUSE_URL
              value: "http://chi-argus-clickhouse-argus-cluster-0-0-0.{{ .Release.Namespace }}.svc.cluster.local:8123"
            - name: GOVCLOUD_REGION
              value: "us-gov-west-1"
            - name: AIRGAP_MODE
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: argus-sso-secret
                  key: jwt-secret
            - name: OIDC_ISSUER
              value: "http://argus-idp.{{ .Release.Namespace }}.svc.cluster.local:8089"
            - name: OIDC_AUDIENCE
              value: "argus-platform"
          ports:
            - name: http-llm
              containerPort: 9098
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9098
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9098
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-aiops-llm-code

apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-sample-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-sample-service
    app.kubernetes.io/component: sample-app
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-sample-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-sample-service
        app.kubernetes.io/component: sample-app
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: sample-service
          image: {{ .Values.imageRegistry }}/argus/{{ .Values.sampleApp.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.{{ .Release.Namespace }}:4318"
            - name: OTEL_SERVICE_NAME
              value: "argus-sample-service"
            - name: PYROSCOPE_SERVER_ADDRESS
              value: "http://pyroscope.{{ .Release.Namespace }}.svc.cluster.local:4040"
            - name: PROFILING_ENABLED
              value: "true"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SAMPLE_APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-sample-app-secret
                  key: SAMPLE_APP_API_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: argus-sample-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-sample-service
    app.kubernetes.io/component: sample-app
    {{- include "argus.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: argus-sample-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080

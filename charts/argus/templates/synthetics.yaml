apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-synthetic-prober-code
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-synthetic-prober
    {{- include "argus.labels" . | nindent 4 }}
data:
  synthetic_prober.py: |
    {{ .Files.Get "files/synthetic_prober.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-synthetic-prober
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-synthetic-prober
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-synthetic-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-synthetic-prober
        {{- include "argus.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9115"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: {{ .Values.imageRegistry }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/synthetic_prober.py"]
          env:
            - name: PORT
              value: "9115"
            - name: SAMPLE_SERVICE_URL
              value: "http://argus-sample-service.{{ .Release.Namespace }}.svc.cluster.local:8080"
            - name: PROBE_INTERVAL
              value: "300"
            - name: SYNTHETIC_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-synthetic-secret
                  key: SYNTHETIC_BEARER_TOKEN
          ports:
            - containerPort: 9115
              name: metrics
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9115
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9115
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-synthetic-prober-code
---
apiVersion: v1
kind: Service
metadata:
  name: argus-synthetic-prober
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-synthetic-prober
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-synthetic-prober
  ports:
    - name: metrics
      port: 9115
      targetPort: 9115

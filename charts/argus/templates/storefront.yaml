{{- if .Values.storefront.enabled }}
{{- $demoNs := .Values.demoNamespace | default "demo" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-storefront-code
  namespace: {{ $demoNs }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
data:
  storefront.py: |
    {{ .Files.Get "files/storefront.py" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-storefront
  namespace: {{ $demoNs }}
  labels:
    app.kubernetes.io/name: argus-storefront
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-storefront
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-storefront
  namespace: {{ $demoNs }}
  labels:
    app.kubernetes.io/name: argus-storefront
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-storefront
      annotations:
        checksum/code: {{ .Files.Get "files/storefront.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: storefront
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/storefront.py"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PORT
              value: "8090"
            - name: GATEWAY_URL
              value: "http://argus-svc-gateway:8001"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.{{ .Release.Namespace }}.svc.cluster.local:4318"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: argus-storefront-code
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argus-storefront
  namespace: {{ $demoNs }}
  labels:
    app.kubernetes.io/name: argus-storefront
    {{- include "argus.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.storefront.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argus-storefront
                port:
                  name: http
{{- end }}
{{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-s3-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: argus-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
  selector:
    app.kubernetes.io/name: argus-s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-s3
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: s3-server
          image: {{ .Values.imageRegistry }}/argus/{{ .Values.storage.s3Image }}
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-s3"
            - "-dir=/data"
            - "-ip=localhost"
            - "-ip.bind=0.0.0.0"
            - "-master.volumeSizeLimitMB=100"
            - "-master.telemetry=false"
            - "-volume.max=100"
            - "-volume.minFreeSpacePercent=1"
          ports:
            - containerPort: 8333
              name: s3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: s3-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: s3-data
          persistentVolumeClaim:
            claimName: argus-s3-pvc

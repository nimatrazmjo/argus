apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-s3-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
data:
  s3.json: |
    {"identities":[{"name":"argus","credentials":[{"accessKey":"any","secretKey":"any"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-s3-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: argus-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
  selector:
    app.kubernetes.io/name: argus-s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-s3
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-s3
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: s3-server
          image: {{ include "argus.image" (list $ .Values.storage.s3Image) }}
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-s3"
            - "-s3.config=/etc/seaweedfs/s3.json"
            - "-dir=/data"
            - "-ip=localhost"
            - "-ip.bind=0.0.0.0"
            - "-master.volumeSizeLimitMB=100"
            - "-master.telemetry=false"
            - "-volume.max=100"
            - "-volume.minFreeSpacePercent=1"
          ports:
            - containerPort: 8333
              name: s3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (for i in $(seq 1 60); do
                       echo "s3.bucket.create -name argus-cold-storage" | weed shell -master=localhost:9333 -filer=localhost:8888 && exit 0
                       sleep 5
                     done) >/proc/1/fd/1 2>&1 &
          volumeMounts:
            - name: s3-data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: s3-config
          configMap:
            name: argus-s3-config
        - name: s3-data
          persistentVolumeClaim:
            claimName: argus-s3-pvc

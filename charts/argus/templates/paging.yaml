apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-servicenow-mock-code
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-servicenow-mock
    {{- include "argus.labels" . | nindent 4 }}
data:
  servicenow_mock.py: |
    {{ .Files.Get "files/servicenow_mock.py" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-paging-gateway-code
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    {{- include "argus.labels" . | nindent 4 }}
data:
  paging_gateway.py: |
    {{ .Files.Get "files/paging_gateway.py" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-servicenow-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-servicenow-mock
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-servicenow-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-servicenow-mock
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      containers:
        - name: mock
          image: {{ .Values.imageRegistry }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/servicenow_mock.py"]
          env:
            - name: PORT
              value: "8088"
          ports:
            - containerPort: 8088
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-servicenow-mock-code
---
apiVersion: v1
kind: Service
metadata:
  name: argus-servicenow-mock
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-servicenow-mock
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-servicenow-mock
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-paging-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-paging-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-paging-gateway
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: {{ .Values.imageRegistry }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/paging_gateway.py"]
          env:
            - name: PORT
              value: "9099"
            - name: SERVICENOW_URL
              value: "http://argus-servicenow-mock.{{ .Release.Namespace }}.svc.cluster.local:8088/api/now/table/incident"
            - name: DEDUP_WINDOW_SECONDS
              value: "300"
            - name: MAX_RETRIES
              value: "5"
            - name: PAGING_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argus-paging-secret
                  key: PAGING_WEBHOOK_TOKEN
          ports:
            - containerPort: 9099
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9099
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9099
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-paging-gateway-code
---
apiVersion: v1
kind: Service
metadata:
  name: argus-paging-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-paging-gateway
  ports:
    - name: http
      port: 9099
      targetPort: 9099

apiVersion: v1
kind: Secret
metadata:
  name: argus-clickhouse-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-clickhouse
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-paging-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  PAGING_WEBHOOK_TOKEN: {{ .Values.secrets.pagingWebhookToken | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-rum-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-rum-collector
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  ingest-token: {{ .Values.secrets.rumIngestToken | b64enc }}
  RUM_INGEST_TOKEN: {{ .Values.secrets.rumIngestToken | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-sso-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-sso
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-synthetic-secret
  namespace: {{ .Values.demoNamespace | default "demo" }}
  labels:
    app.kubernetes.io/name: argus-synthetic-prober
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  SYNTHETIC_BEARER_TOKEN: {{ .Values.secrets.syntheticBearerToken | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: argus-sample-app-secret
  namespace: {{ .Values.demoNamespace | default "demo" }}
  labels:
    app.kubernetes.io/name: argus-sample-service
    {{- include "argus.labels" . | nindent 4 }}
type: Opaque
data:
  SAMPLE_APP_API_TOKEN: {{ .Values.secrets.sampleAppApiToken | b64enc }}

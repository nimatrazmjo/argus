apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-correlation-engine-code
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-correlation-engine
    {{- include "argus.labels" . | nindent 4 }}
data:
  correlation_engine.py: |
    {{ .Files.Get "files/correlation_engine.py" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-correlation-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-correlation-engine
    {{- include "argus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http-corr
      port: 9097
      targetPort: 9097
      protocol: TCP
  selector:
    app.kubernetes.io/name: argus-correlation-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-correlation-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argus-correlation-engine
    {{- include "argus.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-correlation-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-correlation-engine
        {{- include "argus.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: correlation-engine
          image: {{ .Values.imageRegistry }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/correlation_engine.py"]
          env:
            - name: PORT
              value: "9097"
            - name: SERVICENOW_URL
              value: "http://argus-servicenow-mock.{{ .Release.Namespace }}.svc.cluster.local:8088/api/now/table/incident"
            - name: CORRELATION_WINDOW_SECONDS
              value: "120"
          ports:
            - name: http-corr
              containerPort: 9097
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9097
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9097
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-correlation-engine-code

{{- $demoNs := .Values.demoNamespace | default "demo" }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $demoNs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-services-code
  namespace: {{ $demoNs }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
data:
  service_template.py: |
    {{ .Files.Get "files/service_template.py" | nindent 4 }}
---
# ==============================================================================
# 10 MICROSERVICES — Datadog-emulation workloads
# ==============================================================================
{{- $ns := $demoNs }}
{{- $reg := .Values.imageRegistry }}
{{- $services := list
  (dict "name" "argus-svc-gateway"        "role" "gateway"        "port" "8001")
  (dict "name" "argus-svc-auth"           "role" "auth"           "port" "8002")
  (dict "name" "argus-svc-catalog"        "role" "catalog"        "port" "8003")
  (dict "name" "argus-svc-order"          "role" "order"          "port" "8004")
  (dict "name" "argus-svc-inventory"      "role" "inventory"      "port" "8005")
  (dict "name" "argus-svc-payment"        "role" "payment"        "port" "8006")
  (dict "name" "argus-svc-billing"        "role" "billing"        "port" "8007")
  (dict "name" "argus-svc-shipping"       "role" "shipping"       "port" "8008")
  (dict "name" "argus-svc-notification"   "role" "notification"   "port" "8009")
  (dict "name" "argus-svc-recommendation" "role" "recommendation" "port" "8010")
}}
{{- range $services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: argus-services
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
  selector:
    app.kubernetes.io/name: {{ .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: argus-services
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: {{ .role }}
          image: {{ $reg }}/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/service_template.py"]
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: SERVICE_NAME
              value: {{ .name | quote }}
            - name: SERVICE_ROLE
              value: {{ .role | quote }}
            - name: PORT
              value: {{ .port | quote }}
            - name: ENV
              value: "production"
            - name: VERSION
              value: "1.0.0"
            - name: DATACENTER
              value: "us-gov-west-1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.{{ $.Release.Namespace }}.svc.cluster.local:4318"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .port }}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          configMap:
            name: argus-services-code
{{- end }}

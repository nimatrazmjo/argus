# 10. RECOMMENDATION SERVICE (:8010)
apiVersion: v1
kind: Service
metadata:
  name: argus-svc-recommendation
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-svc-recommendation
    app.kubernetes.io/part-of: argus-services
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8010
      targetPort: 8010
  selector:
    app.kubernetes.io/name: argus-svc-recommendation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-svc-recommendation
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-svc-recommendation
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-svc-recommendation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-svc-recommendation
        app.kubernetes.io/part-of: argus-services
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: recommendation
          image: localhost:5001/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/service_template.py"]
          ports:
            - name: http
              containerPort: 8010
          env:
            - name: SERVICE_NAME
              value: "argus-svc-recommendation"
            - name: SERVICE_ROLE
              value: "recommendation"
            - name: PORT
              value: "8010"
            - name: ENV
              value: "production"
            - name: VERSION
              value: "1.0.0"
            - name: DATACENTER
              value: "us-gov-west-1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.argus-system:4318"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8010
            initialDelaySeconds: 38
            periodSeconds: 29
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8010
            initialDelaySeconds: 14
            periodSeconds: 24
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-services-code

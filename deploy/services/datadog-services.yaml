# 1. GATEWAY SERVICE (:8001)
apiVersion: v1
kind: Service
metadata:
  name: argus-svc-gateway
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-svc-gateway
    app.kubernetes.io/part-of: argus-services
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  selector:
    app.kubernetes.io/name: argus-svc-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-svc-gateway
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-svc-gateway
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-svc-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-svc-gateway
        app.kubernetes.io/part-of: argus-services
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 2
      containers:
        - name: gateway
          image: localhost:5001/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/service_template.py"]
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: SERVICE_NAME
              value: "argus-svc-gateway"
            - name: SERVICE_ROLE
              value: "gateway"
            - name: PORT
              value: "8001"
            - name: ENV
              value: "production"
            - name: VERSION
              value: "1.0.0"
            - name: DATACENTER
              value: "us-gov-west-1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.argus-system:4318"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-services-code
---


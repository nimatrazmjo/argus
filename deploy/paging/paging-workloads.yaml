apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-servicenow-mock
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-servicenow-mock
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-servicenow-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-servicenow-mock
        app.kubernetes.io/part-of: argus
    spec:
      containers:
        - name: mock
          image: localhost:5001/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/servicenow_mock.py"]
          env:
            - name: PORT
              value: "8088"
          ports:
            - containerPort: 8088
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-servicenow-mock-code
---
apiVersion: v1
kind: Service
metadata:
  name: argus-servicenow-mock
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-servicenow-mock
    app.kubernetes.io/part-of: argus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-servicenow-mock
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-paging-gateway
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-paging-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-paging-gateway
        app.kubernetes.io/part-of: argus
    spec:
      containers:
        - name: gateway
          image: localhost:5001/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/paging_gateway.py"]
          env:
            - name: PORT
              value: "9099"
            - name: SERVICENOW_URL
              value: "http://argus-servicenow-mock.argus-system.svc.cluster.local:8088/api/now/table/incident"
            - name: DEDUP_WINDOW_SECONDS
              value: "300"
            - name: MAX_RETRIES
              value: "5"
          ports:
            - containerPort: 9099
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9099
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9099
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: argus-paging-gateway-code
---
apiVersion: v1
kind: Service
metadata:
  name: argus-paging-gateway
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-paging-gateway
    app.kubernetes.io/part-of: argus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: argus-paging-gateway
  ports:
    - name: http
      port: 9099
      targetPort: 9099

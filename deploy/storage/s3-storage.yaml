apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-s3-pvc
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-s3
    app.kubernetes.io/part-of: argus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: argus-s3
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-s3
    app.kubernetes.io/part-of: argus
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
  selector:
    app.kubernetes.io/name: argus-s3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-s3
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-s3
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-s3
        app.kubernetes.io/part-of: argus
    spec:
      containers:
        - name: s3-server
          image: localhost:5001/argus/seaweedfs:latest
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "-s3"
            - "-dir=/data"
          ports:
            - containerPort: 8333
              name: s3
          volumeMounts:
            - name: s3-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 8333
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: s3-data
          persistentVolumeClaim:
            claimName: argus-s3-pvc

apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: "argus-keeper"
  namespace: "argus-system"
  annotations:
    argus.io/reconcile-trigger: "2"
spec:
  configuration:
    clusters:
      - name: "keeper-cluster"
        layout:
          replicasCount: 1
        templates:
          podTemplate: keeper-template
          dataVolumeClaimTemplate: keeper-storage
  templates:
    podTemplates:
      - name: keeper-template
        spec:
          containers:
            - name: clickhouse-keeper
              image: localhost:5001/argus/clickhouse-keeper:latest
              imagePullPolicy: IfNotPresent
              startupProbe:
                tcpSocket:
                  port: 2181
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              livenessProbe:
                tcpSocket:
                  port: 2181
                initialDelaySeconds: 10
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 15
              readinessProbe:
                tcpSocket:
                  port: 2181
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 30
    volumeClaimTemplates:
      - name: keeper-storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

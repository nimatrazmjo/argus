apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: "argus-keeper"
  namespace: "argus-system"
  annotations:
    argus.io/reconcile-trigger: "2"
spec:
  configuration:
    clusters:
      - name: "keeper-cluster"
        layout:
          replicasCount: 1
        templates:
          podTemplate: keeper-template
          dataVolumeClaimTemplate: keeper-storage
  templates:
    podTemplates:
      - name: keeper-template
        spec:
          containers:
            - name: clickhouse-keeper
              image: localhost:5001/argus/clickhouse-keeper:latest
              imagePullPolicy: IfNotPresent
              startupProbe:
                exec:
                  command: ['/bin/sh', '-c', 'echo ruok | nc 127.0.0.1 2181 | grep imok']
                initialDelaySeconds: 5
                periodSeconds: 5
                timeoutSeconds: 5
                failureThreshold: 60
              livenessProbe:
                exec:
                  command: ['/bin/sh', '-c', 'echo ruok | nc 127.0.0.1 2181 | grep imok']
                initialDelaySeconds: 15
                periodSeconds: 20
                timeoutSeconds: 5
                failureThreshold: 10
              readinessProbe:
                exec:
                  command: ['/bin/sh', '-c', 'echo ruok | nc 127.0.0.1 2181 | grep imok']
                initialDelaySeconds: 10
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 10
    volumeClaimTemplates:
      - name: keeper-storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

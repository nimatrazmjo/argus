apiVersion: "clickhouse-keeper.altinity.com/v1"
kind: "ClickHouseKeeperInstallation"
metadata:
  name: "argus-keeper"
  namespace: "argus-system"
spec:
  defaults:
    templates:
      podTemplate: keeper-template
  configuration:
    clusters:
      - name: "keeper-cluster"
        layout:
          replicasCount: 1
  templates:
    podTemplates:
      - name: keeper-template
        spec:
          containers:
            - name: clickhouse-keeper
              image: localhost:5001/argus/clickhouse-keeper:latest
              imagePullPolicy: IfNotPresent

apiVersion: "clickhouse.altinity.com/v1"
kind: "ClickHouseInstallation"
metadata:
  name: "argus-clickhouse"
  namespace: "argus-system"
spec:
  defaults:
    templates:
      podTemplate: clickhouse-template
      dataVolumeClaimTemplate: data-storage
  configuration:
    zookeeper:
      nodes:
        - host: chk-argus-keeper-keeper-cluster-0-0
          port: 2181
    users:
      default/password: "argus123"
      default/networks/ip: "::/0"
      default/settings/allow_experimental_json_type: "1"
      default/settings/allow_experimental_object_type: "1"
    profiles:
      default/allow_experimental_json_type: "1"
      default/allow_experimental_object_type: "1"
    files:
      "{users}/json.xml": |
        <clickhouse>
          <profiles>
            <default>
              <allow_experimental_json_type>1</allow_experimental_json_type>
              <allow_experimental_object_type>1</allow_experimental_object_type>
            </default>
          </profiles>
        </clickhouse>
      storage.xml: |
        <clickhouse>
          <storage_configuration>
            <disks>
              <default>
                <type>local</type>
              </default>
              <s3_cold>
                <type>s3</type>
                <endpoint>http://argus-s3.argus-system.svc.cluster.local:8333/argus-cold-storage/data/</endpoint>
                <access_key_id>any</access_key_id>
                <secret_access_key>any</secret_access_key>
              </s3_cold>
            </disks>
            <policies>
              <tiered_hot_cold>
                <volumes>
                  <hot>
                    <disk>default</disk>
                  </hot>
                  <cold>
                    <disk>s3_cold</disk>
                  </cold>
                </volumes>
                <move_factor>0.2</move_factor>
              </tiered_hot_cold>
            </policies>
          </storage_configuration>
        </clickhouse>
      cluster_alias.xml: |
        <clickhouse>
          <remote_servers>
            <cluster>
              <shard>
                <replica>
                  <host>chi-argus-clickhouse-argus-cluster-0-0</host>
                  <port>9000</port>
                  <user>default</user>
                  <password>argus123</password>
                </replica>
              </shard>
            </cluster>
          </remote_servers>
        </clickhouse>
    clusters:
      - name: "argus-cluster"
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse-template
        spec:
          containers:
            - name: clickhouse
              image: localhost:5001/argus/clickhouse-server:25.12.5
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 3584Mi
              livenessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 120
                periodSeconds: 10
                timeoutSeconds: 10
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /ping
                  port: 8123
                initialDelaySeconds: 30
                periodSeconds: 5
                timeoutSeconds: 10
                failureThreshold: 15
    volumeClaimTemplates:
      - name: data-storage
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

apiVersion: v1
kind: Secret
metadata:
  name: argus-rum-secret
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-rum-collector
    app.kubernetes.io/part-of: argus
type: Opaque
data:
  # Default air-gap RUM ingest token ("argus-rum-ingest-token-default-32b", base64-encoded).
  # Override at deploy time via RUM_INGEST_TOKEN env var if rotating.
  ingest-token: YXJndXMtcnVtLWluZ2VzdC10b2tlbi1kZWZhdWx0LTMyYg==
  RUM_INGEST_TOKEN: YXJndXMtcnVtLWluZ2VzdC10b2tlbi1kZWZhdWx0LTMyYg==

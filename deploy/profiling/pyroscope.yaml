apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-pyroscope-data
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: argus
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /var/lib/k8s-pvs/pyroscope-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pyroscope-data
  namespace: argus-system
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: argus
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  namespace: argus-system
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyroscope
        app.kubernetes.io/component: profiling
        app.kubernetes.io/part-of: argus
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: init-permissions
          image: localhost:5001/argus/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data && chmod -R 775 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: pyroscope
          image: localhost:5001/argus/pyroscope:1.7.1
          imagePullPolicy: IfNotPresent
          args:
            - "-target=all"
            - "-usage-stats.enabled=false"
            - "-storage.backend=filesystem"
            - "-storage.filesystem.dir=/data"
            - "-server.http-listen-port=4040"
          ports:
            - name: http
              containerPort: 4040
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 4040
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 4040
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pyroscope-data
---
apiVersion: v1
kind: Service
metadata:
  name: pyroscope
  namespace: argus-system
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: profiling
    app.kubernetes.io/part-of: argus
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pyroscope
  ports:
    - name: http
      port: 4040
      targetPort: 4040

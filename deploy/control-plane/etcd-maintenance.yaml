apiVersion: batch/v1
kind: CronJob
metadata:
  name: argus-etcd-maintenance
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-etcd-maintenance
    app.kubernetes.io/part-of: argus
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: argus-etcd-maintenance
            app.kubernetes.io/part-of: argus
        spec:
          automountServiceAccountToken: false
          hostNetwork: true
          restartPolicy: OnFailure
          tolerations:
            - operator: Exists
          containers:
            - name: etcd-compact-defrag
              image: localhost:5001/argus/python:3.12-alpine
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - -c
                - |
                  import ssl, urllib.request, json

                  ctx = ssl.create_default_context(cafile="/run/config/pki/etcd/ca.crt")
                  ctx.load_cert_chain(
                      certfile="/run/config/pki/etcd/server.crt",
                      keyfile="/run/config/pki/etcd/server.key",
                  )
                  base = "https://127.0.0.1:2379/v3"

                  def post(path, payload):
                      req = urllib.request.Request(
                          base + path,
                          data=json.dumps(payload).encode("utf-8"),
                          headers={"Content-Type": "application/json"},
                          method="POST",
                      )
                      with urllib.request.urlopen(req, context=ctx, timeout=15) as resp:
                          return json.loads(resp.read().decode("utf-8"))

                  status = post("/maintenance/status", {})
                  rev = int(status.get("header", {}).get("revision", 0))
                  print(f"etcd status: revision={rev}, dbSize={status.get('dbSize')}, inUse={status.get('dbSizeInUse')}")
                  if rev > 0:
                      try:
                          post("/kv/compaction", {"revision": rev, "physical": True})
                          print(f"Compacted etcd up to revision {rev}")
                      except Exception as e:
                          print(f"Compaction note: {e}")
                      try:
                          post("/maintenance/defragment", {})
                          print("Defragmented etcd boltdb")
                      except Exception as e:
                          print(f"Defrag note: {e}")
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              volumeMounts:
                - name: etcd-pki
                  mountPath: /run/config/pki/etcd
                  readOnly: true
          volumes:
            - name: etcd-pki
              hostPath:
                path: /run/config/pki/etcd
                type: DirectoryOrCreate

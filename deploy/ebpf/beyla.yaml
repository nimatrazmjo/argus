apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus-beyla
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-beyla
    app.kubernetes.io/part-of: argus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-beyla
  labels:
    app.kubernetes.io/name: argus-beyla
    app.kubernetes.io/part-of: argus
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-beyla
  labels:
    app.kubernetes.io/name: argus-beyla
    app.kubernetes.io/part-of: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-beyla
subjects:
  - kind: ServiceAccount
    name: argus-beyla
    namespace: argus-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-beyla-config
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-beyla
    app.kubernetes.io/part-of: argus
data:
  beyla-config.yml: |
    # Project Argus eBPF Safety Net Configuration
    log_level: INFO

    # Kubernetes metadata decoration
    attributes:
      kubernetes:
        enable: true

    # Discovery rules for un-instrumented HTTP and TCP services
    discovery:
      instrument:
        - open_ports: "80,443,8000-9999"
      exclude_instrument:
        - kubernetes:
            namespace: "kube-system"
        - kubernetes:
            namespace: "kube-public"
        - kubernetes:
            namespace: "kube-node-lease"

    # Export OpenTelemetry traces directly to Argus Gateway Collector
    otel_traces_export:
      endpoint: "http://argus-gateway-collector.argus-system.svc.cluster.local:4318"
      protocol: "http/protobuf"
      batch_timeout: 1s
      max_queue_size: 2048

    # Export OpenTelemetry metrics (RED and network flows)
    otel_metrics_export:
      endpoint: "http://argus-gateway-collector.argus-system.svc.cluster.local:4318"
      protocol: "http/protobuf"
      interval: 10s

    # Network Observability for TCP connection maps and throughput
    network:
      enable: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: argus-beyla
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-beyla
    app.kubernetes.io/part-of: argus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-beyla
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-beyla
        app.kubernetes.io/part-of: argus
    spec:
      serviceAccountName: argus-beyla
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
        - name: beyla
          image: localhost:5001/argus/beyla:2.2.4
          imagePullPolicy: IfNotPresent
          env:
            - name: BEYLA_CONFIG_PATH
              value: "/etc/beyla/beyla-config.yml"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.argus-system.svc.cluster.local:4318"
            - name: BEYLA_KUBE_METADATA_ENABLE
              value: "true"
            - name: BEYLA_OPEN_PORT
              value: "80,443,8000-9999"
          securityContext:
            runAsUser: 0
            privileged: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - BPF
                - PERFMON
                - NET_ADMIN
                - NET_RAW
                - SYS_PTRACE
                - SYS_RESOURCE
                - DAC_READ_SEARCH
                - SYS_ADMIN
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/beyla
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: argus-beyla-config
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: argus-gateway
  namespace: argus-system
spec:
  mode: deployment
  replicas: 1
  serviceAccount: argus-collector
  image: localhost:5001/argus/opentelemetry-collector-contrib:0.160.0
  imagePullPolicy: IfNotPresent
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/kube-state-metrics:
        config:
          scrape_configs:
            - job_name: 'kube-state-metrics'
              scrape_interval: 30s
              scrape_timeout: 25s
              static_configs:
                - targets: ['kube-state-metrics.argus-system.svc.cluster.local:8080']

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
      transform/redaction:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(attributes, "password")
              - delete_key(attributes, "token")
              - delete_key(attributes, "auth_token")
              - delete_key(attributes, "secret")
              - delete_key(attributes, "api_key")
              - delete_key(attributes, "cjis_fbi_number")
              - delete_key(attributes, "ssn")
              - delete_key(attributes, "credit_card")
              - replace_all_patterns(attributes, "value", "\\b\\d{3}-\\d{2}-\\d{4}\\b", "[REDACTED_SSN]")
              - replace_all_patterns(attributes, "value", "\\b(?:\\d[ -]*?){13,16}\\b", "[REDACTED_PAN]")
          - context: spanevent
            statements:
              - delete_key(attributes, "password")
              - delete_key(attributes, "token")
              - delete_key(attributes, "auth_token")
              - delete_key(attributes, "secret")
              - delete_key(attributes, "cjis_fbi_number")
              - delete_key(attributes, "ssn")
              - replace_all_patterns(attributes, "value", "\\b\\d{3}-\\d{2}-\\d{4}\\b", "[REDACTED_SSN]")
              - replace_all_patterns(attributes, "value", "\\b(?:\\d[ -]*?){13,16}\\b", "[REDACTED_PAN]")
        log_statements:
          - context: log
            statements:
              - delete_key(attributes, "password")
              - delete_key(attributes, "token")
              - delete_key(attributes, "auth_token")
              - delete_key(attributes, "secret")
              - delete_key(attributes, "api_key")
              - delete_key(attributes, "cjis_fbi_number")
              - delete_key(attributes, "ssn")
              - delete_key(attributes, "credit_card")
              - replace_all_patterns(attributes, "value", "\\b\\d{3}-\\d{2}-\\d{4}\\b", "[REDACTED_SSN]")
              - replace_all_patterns(attributes, "value", "\\b(?:\\d[ -]*?){13,16}\\b", "[REDACTED_PAN]")
              - replace_pattern(body, "\\b\\d{3}-\\d{2}-\\d{4}\\b", "[REDACTED_SSN]")
              - replace_pattern(body, "\\b(?:\\d[ -]*?){13,16}\\b", "[REDACTED_PAN]")
              - replace_pattern(body, "(?i)(password|secret|token|auth_token|api_key|cjis_fbi_number|ssn)=[^&\\s,;]+", "$$1=[REDACTED]")
      batch:
        timeout: 1s
        send_batch_size: 1024

    exporters:
      clickhouse:
        endpoint: "tcp://clickhouse-argus-clickhouse.argus-system.svc.cluster.local:9000"
        database: "default"
        username: "default"
        password: "argus123"
        ttl: 72h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 5m
      otlp/signoz:
        endpoint: "signoz-otel-collector.argus-system.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/redaction, batch]
          exporters: [clickhouse, otlp/signoz]
        metrics:
          receivers: [otlp, prometheus/kube-state-metrics]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [clickhouse, otlp/signoz]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/redaction, batch]
          exporters: [clickhouse, otlp/signoz]

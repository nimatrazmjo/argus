apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-sample-service
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-sample-service
    app.kubernetes.io/component: sample-app
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-sample-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-sample-service
        app.kubernetes.io/component: sample-app
        app.kubernetes.io/part-of: argus
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: sample-service
          image: localhost:5001/argus/sample-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://argus-gateway-collector.argus-system:4318"
            - name: OTEL_SERVICE_NAME
              value: "argus-sample-service"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: argus-sample-service
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-sample-service
    app.kubernetes.io/component: sample-app
    app.kubernetes.io/part-of: argus
spec:
  selector:
    app.kubernetes.io/name: argus-sample-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080

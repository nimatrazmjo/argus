apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-auto-service
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-auto-service
    app.kubernetes.io/component: auto-instrumented-app
    app.kubernetes.io/part-of: argus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argus-auto-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus-auto-service
        app.kubernetes.io/component: auto-instrumented-app
        app.kubernetes.io/part-of: argus
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: auto-service
          image: localhost:5001/argus/auto-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: argus-auto-service
  namespace: argus-system
  labels:
    app.kubernetes.io/name: argus-auto-service
    app.kubernetes.io/part-of: argus
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: argus-auto-service

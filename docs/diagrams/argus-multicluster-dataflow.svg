<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1260" height="900" fill="#f6f8fa"/>

  <text x="40" y="44" font-size="26" font-weight="700" fill="#1a2733">How Argus gets data from DEV / STAGING / PROD</text>
  <text x="40" y="72" font-size="15" fill="#5b6b7a">Spokes PUSH telemetry out to the hub. The hub never connects INTO the clusters.</text>

  <text x="40" y="104" font-size="13" font-weight="700" fill="#8a97a4" letter-spacing="1">WORKLOAD CLUSTERS (spokes)</text>

  <rect x="40" y="118" width="590" height="312" rx="10" fill="#ffffff" stroke="#2e7d46" stroke-width="2"/>
  <rect x="40" y="118" width="590" height="34" rx="10" fill="#2e7d46"/>
  <rect x="40" y="140" width="590" height="12" fill="#2e7d46"/>
  <text x="58" y="141" font-size="15" font-weight="700" fill="#ffffff">DEV AKS cluster &#8212; resource group: DHS-DEV</text>

  <rect x="60" y="166" width="300" height="60" rx="7" fill="#eef7f0" stroke="#bcd9c5"/>
  <text x="74" y="188" font-size="13.5" font-weight="600" fill="#1a2733">Namespaces (payments, intake, web&#8230;)</text>
  <text x="74" y="208" font-size="12.5" fill="#5b6b7a">App pods &#8594; auto-instrumented &#8594; OTLP</text>
  <text x="74" y="222" font-size="12.5" fill="#5b6b7a">traces &#183; metrics &#183; logs</text>

  <rect x="60" y="234" width="300" height="48" rx="7" fill="#eef7f0" stroke="#bcd9c5"/>
  <text x="74" y="254" font-size="13.5" font-weight="600" fill="#1a2733">node-collector DaemonSet</text>
  <text x="74" y="271" font-size="12.5" fill="#5b6b7a">kubelet/node/pod metrics &#183; pod logs (all ns)</text>

  <rect x="60" y="290" width="300" height="48" rx="7" fill="#eef7f0" stroke="#bcd9c5"/>
  <text x="74" y="310" font-size="13.5" font-weight="600" fill="#1a2733">Beyla (eBPF)</text>
  <text x="74" y="327" font-size="12.5" fill="#5b6b7a">RED metrics + L7 traces, no code change</text>

  <rect x="400" y="190" width="210" height="150" rx="8" fill="#dff0e4" stroke="#2e7d46" stroke-width="1.5"/>
  <text x="505" y="212" font-size="13.5" font-weight="700" fill="#1a2733" text-anchor="middle">Spoke gateway</text>
  <text x="414" y="236" font-size="12.5" fill="#33475b">1 &#183; enrich (k8sattributes)</text>
  <text x="414" y="256" font-size="12.5" fill="#33475b">2 &#183; redact PII/CJIS</text>
  <text x="414" y="276" font-size="12.5" fill="#33475b">3 &#183; stamp tenant_id=dev</text>
  <text x="414" y="296" font-size="12.5" fill="#33475b">4 &#183; batch &#8594; push out</text>
  <text x="505" y="324" font-size="11" fill="#2e7d46" text-anchor="middle" font-style="italic">scrubbed before it leaves</text>

  <g stroke="#6b8c76" stroke-width="2" fill="none" marker-end="url(#ag)">
    <path d="M360 196 H400"/>
    <path d="M360 258 H380 V250 H400"/>
    <path d="M360 314 H380 V300 H400"/>
  </g>

  <rect x="40" y="452" width="286" height="118" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
  <rect x="40" y="452" width="286" height="30" rx="10" fill="#b8860b"/>
  <rect x="40" y="470" width="286" height="12" fill="#b8860b"/>
  <text x="56" y="473" font-size="14" font-weight="700" fill="#ffffff">STAGING AKS &#8212; DHS-STAGING</text>
  <text x="56" y="508" font-size="12.5" fill="#33475b">Same agent bundle (sources +</text>
  <text x="56" y="526" font-size="12.5" fill="#33475b">spoke gateway, enrich &#183; redact &#183;</text>
  <text x="56" y="544" font-size="12.5" font-weight="600" fill="#1a2733">stamp tenant_id=staging)</text>

  <rect x="344" y="452" width="286" height="118" rx="10" fill="#ffffff" stroke="#b23b3b" stroke-width="2"/>
  <rect x="344" y="452" width="286" height="30" rx="10" fill="#b23b3b"/>
  <rect x="344" y="470" width="286" height="12" fill="#b23b3b"/>
  <text x="360" y="473" font-size="14" font-weight="700" fill="#ffffff">PROD AKS &#8212; DHS-PROD</text>
  <text x="360" y="508" font-size="12.5" fill="#33475b">Same agent bundle. CJIS/PII</text>
  <text x="360" y="526" font-size="12.5" fill="#33475b">redacted in-cluster, then</text>
  <text x="360" y="544" font-size="12.5" font-weight="600" fill="#1a2733">stamp tenant_id=prod</text>

  <line x1="668" y1="118" x2="668" y2="600" stroke="#cdd6df" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="690" y="300" font-size="12.5" font-weight="700" fill="#33475b" transform="rotate(90 690 300)" text-anchor="middle">VNet peering &#183; internal LB &#183; TLS + per-spoke token &#183; OTLP 4317</text>

  <g fill="none" stroke="#2e7d46" stroke-width="3.5" marker-end="url(#push)">
    <path d="M610 265 C 700 265, 700 300, 752 300"/>
  </g>
  <g fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#pusho)">
    <path d="M326 511 C 560 511, 650 360, 752 332"/>
  </g>
  <g fill="none" stroke="#b23b3b" stroke-width="3" marker-end="url(#pushr)">
    <path d="M630 511 C 700 511, 700 372, 752 364"/>
  </g>
  <rect x="612" y="238" width="60" height="20" rx="4" fill="#2e7d46"/>
  <text x="642" y="252" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">PUSH</text>

  <text x="752" y="104" font-size="13" font-weight="700" fill="#8a97a4" letter-spacing="1">ARGUS HUB</text>
  <rect x="752" y="118" width="468" height="482" rx="10" fill="#ffffff" stroke="#1f5c99" stroke-width="2"/>
  <rect x="752" y="118" width="468" height="34" rx="10" fill="#1f5c99"/>
  <rect x="752" y="140" width="468" height="12" fill="#1f5c99"/>
  <text x="770" y="141" font-size="15" font-weight="700" fill="#ffffff">Argus HUB &#8212; non-prod / shared-services RG</text>

  <rect x="772" y="290" width="200" height="86" rx="8" fill="#e3eefa" stroke="#1f5c99" stroke-width="1.5"/>
  <text x="872" y="320" font-size="13.5" font-weight="700" fill="#1a2733" text-anchor="middle">Hub ingest gateway</text>
  <text x="872" y="342" font-size="12" fill="#33475b" text-anchor="middle">re-redact (defense in depth)</text>
  <text x="872" y="360" font-size="12" fill="#33475b" text-anchor="middle">NO k8sattributes here</text>

  <rect x="992" y="282" width="208" height="102" rx="8" fill="#eef3f8" stroke="#9db6cf"/>
  <text x="1096" y="308" font-size="13.5" font-weight="700" fill="#1a2733" text-anchor="middle">ClickHouse HA + SigNoz</text>
  <text x="1096" y="332" font-size="12" fill="#33475b" text-anchor="middle">one store for all 3 envs</text>
  <text x="1096" y="352" font-size="12" font-weight="600" fill="#1f5c99" text-anchor="middle">separated by tenant_id</text>
  <text x="1096" y="370" font-size="12" fill="#33475b" text-anchor="middle">(row policies)</text>

  <path d="M972 333 H992" stroke="#1f5c99" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <rect x="772" y="408" width="428" height="52" rx="8" fill="#f2f6fa" stroke="#c6d3df"/>
  <text x="986" y="430" font-size="13" font-weight="700" fill="#1a2733" text-anchor="middle">Alerting &#183; SLO/error-budget &#183; Paging &#183; SSO/RBAC &#183; AIOps</text>
  <text x="986" y="449" font-size="11.5" fill="#5b6b7a" text-anchor="middle">all run here, read from ClickHouse/SigNoz</text>

  <rect x="772" y="476" width="428" height="56" rx="8" fill="#fdf6e3" stroke="#d9c38a"/>
  <text x="986" y="500" font-size="13" font-weight="700" fill="#1a2733" text-anchor="middle">Engineers query SigNoz via SSO</text>
  <text x="986" y="520" font-size="12" fill="#33475b" text-anchor="middle">SSO group &#8594; tenant_id &#8594; each person sees only their env's rows</text>

  <rect x="992" y="166" width="208" height="70" rx="8" fill="#fbeeee" stroke="#b23b3b" stroke-dasharray="5 4"/>
  <text x="1096" y="190" font-size="12.5" font-weight="700" fill="#b23b3b" text-anchor="middle">Azure Monitor API</text>
  <text x="1096" y="209" font-size="11" fill="#7a3b3b" text-anchor="middle">opt-in PULL &#183; Monitoring Reader SP</text>
  <text x="1096" y="225" font-size="11" fill="#7a3b3b" text-anchor="middle">breaks air-gap &#8212; off by default</text>
  <path d="M1096 236 V282" stroke="#b23b3b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#ar)"/>

  <path d="M752 200 C 700 200, 700 165, 632 165" stroke="#b23b3b" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#ar)"/>
  <text x="690" y="150" font-size="12" font-weight="700" fill="#b23b3b" text-anchor="middle">&#10007; no inbound</text>
  <text x="690" y="183" font-size="11" fill="#b23b3b" text-anchor="middle">hub holds no cluster creds</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6b8c76"/></marker>
    <marker id="push" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 z" fill="#2e7d46"/></marker>
    <marker id="pusho" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 z" fill="#b8860b"/></marker>
    <marker id="pushr" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0 0 L11 5 L0 10 z" fill="#b23b3b"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#1f5c99"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#b23b3b"/></marker>
  </defs>
</svg>

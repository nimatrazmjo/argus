repositories:
  - name: open-telemetry
    url: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: clickhouse-operator
    url: https://docs.altinity.com/clickhouse-operator/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

releases:
  # Phase 1: Operators (deployed in parallel; argus chart waits for all three)
  - name: opentelemetry-operator
    chart: open-telemetry/opentelemetry-operator
    version: "0.126.0"
    namespace: '{{ env "ARGUS_NAMESPACE" | default "argus-system" }}'
    createNamespace: true
    wait: true
    timeout: 300
    values:
      - deploy/helm/values/opentelemetry-operator-values.yaml.gotmpl

  - name: altinity-clickhouse-operator
    chart: clickhouse-operator/altinity-clickhouse-operator
    version: "0.27.4"
    namespace: '{{ env "ARGUS_NAMESPACE" | default "argus-system" }}'
    createNamespace: true
    wait: true
    timeout: 300
    values:
      - deploy/helm/values/clickhouse-operator-values.yaml.gotmpl

  - name: prometheus-operator
    chart: prometheus-community/kube-prometheus-stack
    version: "92.3.0"
    namespace: '{{ env "ARGUS_NAMESPACE" | default "argus-system" }}'
    createNamespace: true
    wait: true
    timeout: 300
    values:
      - deploy/helm/values/kube-prometheus-stack-values.yaml.gotmpl

  # Phase 2: All Argus workloads — waits for all three operators above
  - name: argus
    chart: ./charts/argus
    namespace: '{{ env "ARGUS_NAMESPACE" | default "argus-system" }}'
    createNamespace: true
    wait: true
    timeout: 600
    needs:
      - opentelemetry-operator
      - altinity-clickhouse-operator
      - prometheus-operator
    values:
      - charts/argus/values.yaml
      - charts/argus/registry-override.yaml.gotmpl
